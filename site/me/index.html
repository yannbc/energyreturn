<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Yann Burden — CV">
<meta property="og:description" content="CV and background — Founder and technical leader across energy, SaaS and AI.">
<meta property="og:image" content="https://energyreturn.co/og-card.png">
<meta property="og:url" content="https://energyreturn.co/me">
<meta property="og:type" content="website">
<title>Yann Burden — CV</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    /* Tokens mirror site/index.html */
    --paper:  oklch(98.4% 0.006 75);
    --rule:   oklch(89.0% 0.012 75);
    --ink:    oklch(20.0% 0.012 75);
    --ink-2:  oklch(40.0% 0.010 75);
    --ink-3:  oklch(58.0% 0.008 75);
    --forest: oklch(38.0% 0.090 145);
    --ochre:  oklch(58.0% 0.090 70);

    --serif: 'Source Serif 4', Georgia, serif;
    --mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--serif); color: var(--ink); background: var(--paper); font-size: 14px; line-height: 1.6; }

  .page { max-width: 760px; margin: 40px auto; padding: 48px 56px; }

  @page { size: A4; margin: 14mm 15mm; }

  @media print {
    body { font-size: 11pt; }
    .page { margin: 0; padding: 0; max-width: none; }
    .no-print { display: none !important; }
    a { color: var(--ink); text-decoration: none; }
    .dim { opacity: 1 !important; }

    /* Pagination: keep logical blocks intact across page breaks */
    .role, .compact-item, .highlights li, .role-bullets li { break-inside: avoid; page-break-inside: avoid; }
    .section-title { break-after: avoid; page-break-after: avoid; }
  }

  /* --- HEADER --- */
  header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid var(--ink); }
  h1 { font-size: 28px; font-weight: 300; line-height: 1.05; letter-spacing: -0.025em; color: var(--ink); }
  .tagline { font-size: 15px; font-weight: 300; color: var(--ink-2); margin-top: 4px; }
  .contact-info { text-align: right; font-family: var(--mono); font-size: 11px; color: var(--ink-2); line-height: 1.8; letter-spacing: 0.04em; }
  .contact-info a { color: var(--ink-2); text-decoration: none; }
  .citizenship { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-top: 4px; letter-spacing: 0.04em; }

  /* --- SECTIONS --- */
  .section { margin-bottom: 20px; }
  .section-title { font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--forest); margin-bottom: 10px; padding-bottom: 4px; border-bottom: 1px solid var(--rule); }

  /* Press and Media -- ochre accent for external voice */
  .section.press .section-title { color: var(--ochre); border-bottom-color: var(--ochre); }

  /* --- HIGHLIGHTS --- */
  .highlights { font-size: 13px; color: var(--ink-2); line-height: 1.7; }
  .highlights li { margin-bottom: 4px; margin-left: 16px; transition: opacity 0.2s ease; }

  /* --- ROLES --- */
  .role { margin-bottom: 16px; transition: opacity 0.2s ease; }
  .role-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
  .role-company { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--ink); letter-spacing: 0.02em; }
  .role-dates { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; }
  .role-title { font-size: 16px; font-weight: 400; margin-bottom: 4px; color: var(--ink); }
  .role-bullets { font-size: 13px; color: var(--ink-2); }
  .role-bullets li { margin-bottom: 3px; margin-left: 16px; }

  /* --- SIDEBAR ITEMS (education, advisory, etc) --- */
  .compact-item { margin-bottom: 10px; transition: opacity 0.2s ease; }
  .compact-item .item-org { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--ink); letter-spacing: 0.02em; }
  .compact-item .item-detail { font-size: 13px; color: var(--ink-2); }
  .compact-item .item-dates { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.04em; }

  /* --- TWO COLUMN --- */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  @media (max-width: 600px) { .two-col { grid-template-columns: 1fr; } }

  /* --- FOCUS TAGS --- */
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .tag { font-family: var(--mono); font-size: 10px; padding: 2px 8px; border: 1px solid var(--rule); border-radius: 3px; color: var(--ink-2); }

  /* --- DIM: items not relevant to current highlight --- */
  .dim { opacity: 0.22; }

  /* --- HIGHLIGHT BAR (screen only) --- */
  .flavour-bar { max-width: 760px; margin: 20px auto 0; padding: 12px 56px; display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; }
  .flavour-bar button { font-family: var(--mono); font-size: 11px; padding: 4px 12px; margin-right: 6px; border: 1px solid var(--rule); border-radius: 3px; background: var(--paper); color: var(--ink-2); cursor: pointer; transition: background 0.15s ease, color 0.15s ease; }
  .flavour-bar button.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .flavour-bar .download-btn { display: inline-block; margin-right: 0; padding: 4px 12px; font-family: var(--mono); font-size: 11px; font-weight: 500; text-decoration: none; border: 1px solid var(--forest); border-radius: 3px; background: var(--paper); color: var(--forest); cursor: pointer; transition: background 0.15s ease, color 0.15s ease; }
  .flavour-bar .download-btn:hover { background: var(--forest); color: var(--paper); border-color: var(--forest); }
</style>
</head>
<body>

<div class="flavour-bar no-print">
  <div class="flavour-toggles">
    <span>Highlight: </span>
    <button class="active" onclick="setFlavour('default')">Full</button>
    <button onclick="setFlavour('product')">Product / CPTO</button>
    <button onclick="setFlavour('ai')">AI Leadership</button>
    <button onclick="setFlavour('advisory')">Advisory / Consulting</button>
  </div>
  <a class="download-btn" href="yann-burden-cv.pdf" download="Yann Burden CV.pdf">Download PDF ↓</a>
</div>

<div class="page" id="cv"><!-- rendered by JS --></div>

<script>
// ============================================================
// CV DATA — edit this object to update all content
// ============================================================
const CV = {
  name: "Yann Burden",
  taglines: {
    default:    "Technology Executive. Exited Founder and Operator.",
    product:    "Product and Technology Executive. Exited Founder.",
    ai:         "Product, Technology and AI Executive. Exited Founder.",
    advisory:   "Technology Leadership and AI Advisory. Exited Founder.",
  },
  contact: {
    phone: "+61 400 941 979",
    email: "yannburden@gmail.com",
    web: "energyreturn.co/me",
    linkedin: "yannburden",
  },
  citizenship: "🇦🇺 🇬🇧 🇪🇺 🇨🇦  Working rights: Australia, UK, EU, Canada",

  // --- HIGHLIGHTS: each has text + which flavours it is relevant to ---
  highlights: [
    { text: "Founded and scaled Billcap (multi-tenant SaaS for energy utilities) as CEO through to exit at 8x investor return.", flavours: ["default","product","ai","advisory"] },
    { text: "Hired as CPTO at Pendula, led engineering, product and AI organisation through international expansion and acquisition by Smart Communications at 4x invested capital.", flavours: ["default","product","ai"] },
    { text: "Drove $5M incremental ARR by reorienting platform delivery toward enterprise clients.", flavours: ["default","product"] },
    { text: "Built Pendula's London operation from scratch with GM mandate: market entry, hiring, first UK client.", flavours: ["default","product"] },
    { text: "Built and operated customer engagement platforms across 5 energy retailers and 250,000+ end users, each with distinct regulatory and operational requirements.", flavours: ["default","product","ai"] },
    { text: "A decade advising CIOs and boards on technology strategy, IT organisation design and large-scale outsourcing across Australia, UK and Europe (Accenture, PwC, Unilog).", flavours: ["default","product","advisory"] },
    { text: "Venture Partner at Black Nova VC, coaching growth-stage portfolio founders on AI strategy, architecture decisions, and build discipline.", flavours: ["ai","advisory"] },
    { text: "Industry advisory board member at the University of Melbourne (2015-2024), bridging technology industry practice with academic curriculum.", flavours: ["advisory"] },
  ],

  // --- FOCUS TAGS per flavour ---
  focus: {
    default:    ["Energy and Utilities","Scale-Up SaaS","AI Strategy","International Expansion","Platform Operations"],
    product:    ["Product Leadership","Scale-Up SaaS","AI Product","Enterprise SaaS","International Expansion"],
    ai:         ["AI Strategy","Conversational AI","Customer Engagement","Scale-Up SaaS","Energy and Utilities"],
    advisory:   ["AI Strategy","Organisational Change","Education","Energy and Utilities","SaaS"],
  },

  // --- EXPERIENCE ---
  roles: [
    {
      company: "Pendula", dates: "2021 - 2025", title: "Chief Product and Technology Officer",
      flavours: ["default","product","ai"],
      bullets: [
        "Hired as CPTO. Led engineering and product teams through Series A and international expansion.",
        "Unlocked additional $5M ARR by leading enterprise product focus.",
        "Set up London offices as part of international growth strategy post Series A, signed first UK deal.",
        "Led strategy and AI initiatives through to sale to Smart Communications at 4x invested capital.",
      ]
    },
    {
      company: "DC Power Co", dates: "2018 - 2021", title: "Chief Customer and Technology Officer",
      flavours: ["default","product","ai","advisory"],
      bullets: [
        "Founding executive team of Australia's first crowd-funded renewable energy retailer.",
        "Delivered strategic NPS of +51 in first year of operation.",
        "Developed in-house customer engagement product reducing churn by over 25%.",
        "Set up digital sales channel delivering market-leading conversion rates for battery storage.",
      ]
    },
    {
      company: "Billcap", dates: "2011 - 2018", title: "CEO and Co-founder",
      flavours: ["default","product","ai","advisory"],
      bullets: [
        "Co-founded and led company delivering customer engagement SaaS platform to energy retailers and distributors.",
        "Grew client base to 5 energy companies and over 250,000 users.",
        "Led sale of company to strategic investor delivering 8x return to investors.",
        "Hands-on technical contributor: prototyped and iterated ML models in R for outlier detection and demand prediction.",
        "Established pioneering research partnership with University of Melbourne; ran randomised field experiments across 8,000 households, generating three peer-reviewed publications in top economics journals.",
      ]
    },
    {
      company: "Energy Return", dates: "2009 - 2011", title: "Founder and Managing Director",
      flavours: ["default","product","advisory"],
      bullets: [
        "Energy efficiency consulting for local government.",
      ]
    },
    {
      company: "Cool Nrg", dates: "2007 - 2009", title: "General Manager — France",
      flavours: ["default","product"],
      bullets: [
        "Nation-wide residential energy efficiency and carbon abatement programs for energy retailers.",
      ]
    },
    {
      company: "Accenture (UK)", dates: "2005 - 2007", title: "Technology Strategy Manager",
      flavours: ["default","product","advisory"],
      bullets: [
        "CIO advisory, IT organisation design, telco strategy.",
      ]
    },
    {
      company: "Unilog (France)", dates: "2004", title: "Technology Strategy Consultant (contract)",
      flavours: ["default","advisory"],
      bullets: [
        "Technology strategy consulting with energy retail focus.",
      ]
    },
    {
      company: "PwC Consulting", dates: "1999 - 2002", title: "SAP Consultant",
      flavours: ["default","advisory"],
      bullets: [
        "SAP consulting across multiple client engagements.",
      ]
    },
  ],

  // --- ADVISORY and BOARDS ---
  advisory: [
    { org: "University of Sydney", role: "Industry Advisory Board Member, School of Computer Science", dates: "Jun 2026 -", flavours: ["default","ai","advisory"] },
    { org: "Black Nova Venture Capital", role: "Venture Partner, AI Advisory", dates: "2025 -", flavours: ["default","ai","advisory"] },
    { org: "University of Melbourne", role: "Honorary Industry Fellow, School of Computing and Information Systems", dates: "2015 - 2024", flavours: ["default","advisory"] },
    { org: "Bendigo Bank Community Bank (North Fitzroy)", role: "Non-Executive Director", dates: "2010 - 2017", flavours: ["default"] },
  ],

  // --- EDUCATION ---
  education: [
    { org: "University of Melbourne", detail: "Bachelor of Science (Information Systems)", dates: "1998" },
  ],

  // --- RESEARCH ---
  research: [
    { title: "Tell Me Something I Don't Already Know: Informedness and the Impact of Information Programs", journal: "Review of Economics and Statistics", year: "2018", url: "https://direct.mit.edu/rest/article/100/3/510/58467/Tell-Me-Something-I-Don-t-Already-Know", authors: "Byrne, La Nauze, Martin", flavours: ["default","ai","advisory"] },
    { title: "An Experimental Study of Monthly Electricity Demand (In)elasticity", journal: "The Energy Journal", year: "2021", url: "https://journals.sagepub.com/doi/10.5547/01956574.42.2.dbyr", authors: "Byrne, La Nauze, Martin", flavours: ["default","ai","advisory"] },
    { title: "Power from the People: Rooftop Solar and a Downward-Sloping Supply of Electricity", journal: "Journal of Political Economy", year: "2019", url: "https://doi.org/10.1086/705535", authors: "La Nauze", flavours: ["default","ai","advisory"] },
  ],

  // --- TECHNICAL ---
  technical: [
    { heading: "Hands-on with current AI tooling", body: "Day-to-day agentic development in Claude Code and Cursor — spec-driven, TDD-aware. Python, TypeScript, SQL. My current side project (a solar panel performance assessment app) is built end-to-end on this loop.", flavours: ["default","product","ai"] },
    { heading: "I design and ship agent systems", body: "Multi-agent orchestration over enterprise data, with cost and quality instrumented from day one. CrewAI, Anthropic SDK, AWS Bedrock, Langfuse. Led Pendula's AI-powered analytics layer — so non-engineers could query data directly instead of waiting on the data team.", flavours: ["default","ai","advisory"] },
    { heading: "Production AI, not demos", body: "Intent classification, next-best-action scoring, conversational agents with RAG and tool use. The substrate behind Pendula's $5M ARR uplift.", flavours: ["default","ai"] },
    { heading: "Cloud, data, ops", body: "AWS, GCP, Postgres, event streaming, MLOps. Senior enough to architect, hands-on enough to spot issues myself.", flavours: ["default","product","ai"] },
  ],

  // --- PRESS ---
  press: [
    { outlet: "SmartCompany", year: "2023", title: "Eight Aussie startups that raised $149 million this week", description: "Featured in coverage of Pendula's $14.5M raise.", url: "https://www.smartcompany.com.au/startupsmart/eight-aussie-startups-raised-149-million-week/", flavours: ["default","advisory"] },
    { outlet: "Tech Trajectory Podcast (DiUS)", year: "2025", title: "Leading with Customer Clarity in a Changing World", description: "In conversation with Kavita Karwar on AI adoption, product strategy, and how customer clarity separates sustainable growth from hype.", url: "https://techtrajectorypodcast.buzzsprout.com/2457356/episodes/17422143-leading-with-customer-clarity-in-a-changing-world", flavours: ["default","ai","advisory"] },
  ],
};

// ============================================================
// RENDERER
// ============================================================
let currentFlavour = 'default';

function setFlavour(f) {
  currentFlavour = f;
  document.querySelectorAll('.flavour-toggles button').forEach(b => {
    b.classList.toggle('active', b.textContent.toLowerCase().includes(f === 'default' ? 'full' : f));
  });
  render();
}

// Returns true if item should be dimmed in the current flavour context
function isDim(item) {
  if (currentFlavour === 'default') return false;
  if (!item.flavours) return false;
  return !item.flavours.includes(currentFlavour);
}

function d(cls, dimmed) {
  return dimmed ? `${cls} dim` : cls;
}

function render() {
  const f = currentFlavour;
  const tagline = CV.taglines[f] || CV.taglines.default;
  const focusTags = CV.focus[f] || CV.focus.default;

  let html = `
    <header>
      <div>
        <h1>${CV.name}</h1>
        <div class="tagline">${tagline}</div>
      </div>
      <div class="contact-info">
        ${CV.contact.phone}<br>
        <a href="mailto:${CV.contact.email}">${CV.contact.email}</a><br>
        <a href="https://${CV.contact.web}">${CV.contact.web}</a><br>
        <a href="https://linkedin.com/in/${CV.contact.linkedin}">linkedin.com/in/${CV.contact.linkedin}</a>
        <div class="citizenship">${CV.citizenship}</div>
      </div>
    </header>
  `;

  // Highlights
  html += `<div class="section"><div class="section-title">Highlights</div><ul class="highlights">`;
  CV.highlights.forEach(h => {
    html += `<li class="${isDim(h) ? 'dim' : ''}">${h.text}</li>`;
  });
  html += `</ul></div>`;

  // Focus (always shows current flavour's tags)
  html += `<div class="section"><div class="section-title">Focus</div><div class="tags">`;
  focusTags.forEach(t => html += `<span class="tag">${t}</span>`);
  html += `</div></div>`;

  // Experience — all roles shown, dimmed if not relevant
  html += `<div class="section"><div class="section-title">Experience</div>`;
  CV.roles.forEach(r => {
    const dimmed = isDim(r);
    html += `<div class="${d('role', dimmed)}">
      <div class="role-header"><span class="role-company">${r.company} | ${r.dates}</span></div>
      <div class="role-title">${r.title}</div>`;
    if (r.bullets && r.bullets.length) {
      html += `<ul class="role-bullets">`;
      r.bullets.forEach(b => html += `<li>${b}</li>`);
      html += `</ul>`;
    }
    html += `</div>`;
  });
  html += `</div>`;

  // Two-column: advisory + education/research
  html += `<div class="two-col">`;

  // Left: advisory
  html += `<div class="section"><div class="section-title">Advisory and Boards</div>`;
  CV.advisory.forEach(a => {
    html += `<div class="${d('compact-item', isDim(a))}">
      <div class="item-org">${a.org}</div>
      <div class="item-detail">${a.role}</div>
      <div class="item-dates">${a.dates}</div>
    </div>`;
  });
  html += `</div>`;

  // Right: education + research
  html += `<div>`;
  html += `<div class="section"><div class="section-title">Education</div>`;
  CV.education.forEach(e => {
    html += `<div class="compact-item">
      <div class="item-org">${e.org}</div>
      <div class="item-detail">${e.detail}</div>
      <div class="item-dates">${e.dates}</div>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="section"><div class="section-title">Research Collaborations</div>`;
  CV.research.forEach(r => {
    const titleHtml = r.url
      ? `<a href="${r.url}" target="_blank" style="color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule);">${r.title}</a>`
      : r.title;
    html += `<div class="${d('compact-item', isDim(r))}">
      <div class="item-detail">${titleHtml}</div>
      <div class="item-dates">${r.journal} (${r.year})${r.authors ? ' — ' + r.authors : ''}</div>
    </div>`;
  });
  html += `</div>`;

  html += `</div></div>`;

  // Technical -- capability statements, not a tech inventory
  html += `<div class="section"><div class="section-title">Technical</div><ul class="highlights">`;
  CV.technical.forEach(t => {
    const dimmed = isDim(t);
    html += `<li class="${dimmed ? 'dim' : ''}"><strong>${t.heading}.</strong> ${t.body}</li>`;
  });
  html += `</ul></div>`;

  // Press and media
  html += `<div class="section press"><div class="section-title">Press and Media</div>`;
  CV.press.forEach(p => {
    const titleHtml = p.url
      ? `<a href="${p.url}" target="_blank" style="color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule);">${p.title}</a>`
      : p.title;
    html += `<div class="${d('compact-item', isDim(p))}">
      <div class="item-org">${p.outlet}</div>
      <div class="item-detail">${titleHtml}</div>
      <div class="item-dates">${p.year}${p.description ? ' — ' + p.description : ''}</div>
    </div>`;
  });
  html += `</div>`;

  document.getElementById('cv').innerHTML = html;
}

render();
</script>
</body>
</html>
